name: 阶段控制台独立验证

on:
  pull_request:
    paths:
      - "tools/live_progress/**"
      - "docs/live-progress-frontend-spec.md"
      - ".github/workflows/live-progress.yml"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "tools/live_progress/**"
      - "docs/live-progress-frontend-spec.md"
      - ".github/workflows/live-progress.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-progress:
    name: 独立工具测试与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 检出候选提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Python 3.12.3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      - name: 安装 Node 24 与 npm 11
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/live_progress/web/package-lock.json

      - name: 固定 npm 11
        run: npm install --global npm@11.19.0

      - name: 验证 Python 只读服务
        run: python -m unittest discover -s tools/live_progress/tests -p 'test_*.py' -v

      - name: 安装前端精确依赖树
        working-directory: tools/live_progress/web
        run: npm ci

      - name: 前端 lint
        working-directory: tools/live_progress/web
        run: npm run lint

      - name: 前端独立类型检查
        working-directory: tools/live_progress/web
        run: npm run typecheck

      - name: 前端组件测试
        working-directory: tools/live_progress/web
        run: npm test

      - name: 前端可复现构建
        working-directory: tools/live_progress/web
        run: npm run build
